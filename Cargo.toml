[workspace]
resolver = "3"
members = ["crates/paseka-proto", "crates/paseka-core", "crates/paseka-conformance", "crates/paseka"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/pasekahq/paseka-gate"
publish = false

[workspace.dependencies]
paseka-proto = { path = "crates/paseka-proto" }
paseka-core = { path = "crates/paseka-core" }
paseka-conformance = { path = "crates/paseka-conformance" }
base64 = { version = "0.22", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

# Size-first release profile. The binary-size budget in ci/budgets.sh depends on it.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
